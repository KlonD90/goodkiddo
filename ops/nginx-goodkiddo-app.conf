# GoodKiddo only. Cloudflare visitor HTTPS -> existing nginx HTTP origin.
# Install only after the approved listener is healthy and port 4184 is free.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.invalid;

    # URL tokens are bearer capabilities. No token-bearing request logs.
    access_log off;
    error_log /dev/null;
    client_max_body_size 1k;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /fs {
        proxy_pass http://127.0.0.1:4184;
        proxy_http_version 1.1;
        proxy_set_header Host app.example.invalid;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /fs/ {
        proxy_pass http://127.0.0.1:4184;
        proxy_http_version 1.1;
        proxy_set_header Host app.example.invalid;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }
    location / {
        return 404;
    }
}
