# Include INSIDE the existing whosagoodkiddo.me server block only after approval.
# No new vhost, listener, DNS record, TLS settings or service is created here.
# Preserve the original Host: the page handler rejects app/unknown hostnames.
location ^~ /p/ {
    access_log off;
    error_log /dev/null;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:4184;
    proxy_http_version 1.1;
    proxy_set_header Host whosagoodkiddo.me;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    # Do not add 'always' CSP headers from the landing app at this location.
    # Preserve the backend's sandbox CSP; never hide/replace these headers.
}
